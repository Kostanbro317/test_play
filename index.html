<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мінігра</title>
<link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
<!-- <button id="resetBtn">тут</button> -->
<div class="casino">
	<div id="balance"></div>
	<div id="result">Нажміть грати</div>
	<button id="playBtn">Грати</button>
	<button id="plusCircle"></button>
</div>
<script>
/* ===== БАЛАНС ===== */
let balance = Number(localStorage.getItem("balance"));
if (isNaN(balance)) {
	balance = 100;
	localStorage.setItem("balance", balance);
}

const balanceEl = document.getElementById("balance");
const resultEl = document.getElementById("result");

function updateBalance() {
	balanceEl.textContent = "💰 Баланс: " + balance;
}
updateBalance();

/* ===== ОСНОВНА ГРА ===== */
const GAME_COST = 10;
const WIN_CHANCE = 0.1;
const WIN_REWARD = 100;

document.getElementById("playBtn").onclick = () => {
	if (balance < GAME_COST) {
		resultEl.textContent = "Недостатньо коштів!";
		return;
	}

	balance -= GAME_COST;

	if (Math.random() < WIN_CHANCE) {
		balance += WIN_REWARD;
		resultEl.textContent = "WIN!!!";
	} else {
		resultEl.textContent = "LOSE!!!";
	}

	localStorage.setItem("balance", balance);
	updateBalance();
};

/* ===== КУЛІ ===== */
const circles = [];

function createCircle() {
	const el = document.createElement("div");
	el.className = "circle";
	document.body.appendChild(el);

	const c = {
		el,
		x: Math.random() * (window.innerWidth - 40),
		y: Math.random() * (window.innerHeight - 40),
		dx: (Math.random() * 2 + 1) * (Math.random() < 0.5 ? -1 : 1),
		dy: (Math.random() * 2 + 1) * (Math.random() < 0.5 ? -1 : 1),
		active: true
	};

	el.style.left = c.x + "px";
	el.style.top = c.y + "px";

	el.addEventListener("click", (e) => hitCircle(e, c));
	el.addEventListener("touchstart", (e) => hitCircle(e, c));

	circles.push(c);
}

function moveCircles() {
	circles.forEach(c => {
		if (!c.active) return;

		c.x += c.dx;
		c.y += c.dy;

		if (c.x <= 0 || c.x >= window.innerWidth - 40) c.dx *= -1;
		if (c.y <= 0 || c.y >= window.innerHeight - 40) c.dy *= -1;

		c.el.style.left = c.x + "px";
		c.el.style.top = c.y + "px";
	});
}
setInterval(moveCircles, 16);

/* ===== КЛІК ПО КУЛІ ===== */
function hitCircle(e, c) {
	if (!c.active) return;
	e.preventDefault();

	c.active = false;
	c.el.style.display = "none";

	balance += 10;
	localStorage.setItem("balance", balance);
	updateBalance();
	resultEl.textContent = "+10!";

	setTimeout(() => {
		c.x = Math.random() * (window.innerWidth - 40);
		c.y = Math.random() * (window.innerHeight - 40);
		c.el.style.display = "block";
		c.active = true;
	}, 5000);
}

/* ===== ЦІНА ТА КІЛЬКІСТЬ КУЛЬ ===== */
let circlePrice = Number(localStorage.getItem("circlePrice")) || 50;
let circleCount = Number(localStorage.getItem("circleCount")) || 1;

const plusCircleBtn = document.getElementById("plusCircle");

function updateCircleButton() {
	plusCircleBtn.textContent = `Купити (${circlePrice}) | Куль: ${circleCount}`;
}
updateCircleButton();

/* ===== КУПИТИ КУЛЮ ===== */
plusCircleBtn.onclick = () => {
	if (balance < circlePrice) {
		resultEl.textContent = "Недостатньо коштів!";
		return;
	}

	balance -= circlePrice;
	circlePrice += 50;
	circleCount++;

	localStorage.setItem("balance", balance);
	localStorage.setItem("circlePrice", circlePrice);
	localStorage.setItem("circleCount", circleCount);

	updateBalance();
	updateCircleButton();
	createCircle();
};

/* ===== ВІДНОВЛЕННЯ КУЛЬ ===== */
for (let i = 0; i < circleCount; i++) {
	createCircle();
}
// document.getElementById("resetBtn").onclick = () => {
// 	localStorage.clear();
// 	location.reload();
// };

</script>

</body>
</html>
